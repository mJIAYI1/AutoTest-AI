name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run backend tests
        run: bash backend/mvnw -B -f backend/pom.xml test

  demo-api-tests:
    name: Demo API tests (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: demo-api/pom.xml
      - name: Run Demo API tests
        run: bash backend/mvnw -B -f demo-api/pom.xml test

  frontend-build:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend-tests, demo-api-tests, frontend-build]
    env:
      MYSQL_DATABASE: autotest_ai
      MYSQL_USER: autotest
      MYSQL_PASSWORD: ci_mysql_password
      MYSQL_ROOT_PASSWORD: ci_root_password
      JWT_SECRET: ci_only_jwt_secret_at_least_32_characters_long
      MYSQL_PORT: "3307"
      SERVER_PORT: "18080"
      FRONTEND_PORT: "5173"
      DEMO_API_PORT: "8081"
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the complete platform
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Verify public endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:18080/actuator/health
          curl --fail --silent --show-error http://127.0.0.1:8081/v3/api-docs
          curl --fail --silent --show-error http://127.0.0.1:5173/
      - name: Show container state
        if: always()
        run: docker compose ps
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v
