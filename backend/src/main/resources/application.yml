server:
  port: ${SERVER_PORT:18080}
  shutdown: graceful

spring:
  application:
    name: autotest-ai-backend
  servlet:
    multipart:
      max-file-size: ${OPENAPI_UPLOAD_MAX_FILE_SIZE:6MB}
      max-request-size: ${OPENAPI_UPLOAD_MAX_REQUEST_SIZE:6MB}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/autotest_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:autotest}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:autotest-ai}
      expiration: ${JWT_EXPIRATION:PT2H}
  openapi:
    import:
      allowed-hosts: ${OPENAPI_IMPORT_ALLOWED_HOSTS:localhost,127.0.0.1}
      max-document-bytes: ${OPENAPI_IMPORT_MAX_BYTES:5242880}
      connect-timeout: ${OPENAPI_IMPORT_CONNECT_TIMEOUT:PT5S}
      read-timeout: ${OPENAPI_IMPORT_READ_TIMEOUT:PT15S}
  execution:
    allowed-hosts: ${TEST_EXECUTION_ALLOWED_HOSTS:localhost,127.0.0.1}
    connect-timeout: ${TEST_EXECUTION_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${TEST_EXECUTION_READ_TIMEOUT:PT15S}
    max-response-body-bytes: ${TEST_EXECUTION_MAX_RESPONSE_BYTES:1048576}
    core-pool-size: ${TEST_EXECUTION_CORE_POOL_SIZE:2}
    max-pool-size: ${TEST_EXECUTION_MAX_POOL_SIZE:4}
    queue-capacity: ${TEST_EXECUTION_QUEUE_CAPACITY:100}
    max-suite-cases: ${TEST_SUITE_MAX_CASES:50}
  ai:
    silicon-flow:
      api-key: ${SILICONFLOW_API_KEY:}
      base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
      model: ${SILICONFLOW_MODEL:}
      max-tokens: ${SILICONFLOW_MAX_TOKENS:4096}
      timeout: ${SILICONFLOW_TIMEOUT:PT90S}
