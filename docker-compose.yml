name: autotest-ai

services:
  mysql:
    image: mysql:8.4
    container_name: autotest-ai-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-autotest_ai}"
      MYSQL_USER: "${MYSQL_USER:-autotest}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql

  demo-api:
    build:
      context: ./demo-api
    image: autotest-ai-demo-api:local
    container_name: autotest-ai-demo-api
    restart: unless-stopped
    ports:
      - "${DEMO_API_PORT:-8081}:8081"
    environment:
      SERVER_PORT: "8081"
      TZ: Asia/Shanghai

  backend:
    build:
      context: ./backend
    image: autotest-ai-backend:local
    container_name: autotest-ai-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-18080}:18080"
    environment:
      SERVER_PORT: "18080"
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-autotest_ai}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USERNAME: "${MYSQL_USER:-autotest}"
      DB_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_ISSUER: "${JWT_ISSUER:-autotest-ai}"
      JWT_EXPIRATION: "${JWT_EXPIRATION:-PT2H}"
      OPENAPI_IMPORT_ALLOWED_HOSTS: "${DOCKER_OPENAPI_IMPORT_ALLOWED_HOSTS:-localhost,127.0.0.1,host.docker.internal,demo-api}"
      OPENAPI_IMPORT_MAX_BYTES: "${OPENAPI_IMPORT_MAX_BYTES:-5242880}"
      OPENAPI_IMPORT_CONNECT_TIMEOUT: "${OPENAPI_IMPORT_CONNECT_TIMEOUT:-PT5S}"
      OPENAPI_IMPORT_READ_TIMEOUT: "${OPENAPI_IMPORT_READ_TIMEOUT:-PT15S}"
      TEST_EXECUTION_ALLOWED_HOSTS: "${DOCKER_TEST_EXECUTION_ALLOWED_HOSTS:-localhost,127.0.0.1,host.docker.internal,demo-api}"
      TEST_EXECUTION_CONNECT_TIMEOUT: "${TEST_EXECUTION_CONNECT_TIMEOUT:-PT5S}"
      TEST_EXECUTION_READ_TIMEOUT: "${TEST_EXECUTION_READ_TIMEOUT:-PT15S}"
      TEST_EXECUTION_MAX_RESPONSE_BYTES: "${TEST_EXECUTION_MAX_RESPONSE_BYTES:-1048576}"
      TEST_EXECUTION_CORE_POOL_SIZE: "${TEST_EXECUTION_CORE_POOL_SIZE:-2}"
      TEST_EXECUTION_MAX_POOL_SIZE: "${TEST_EXECUTION_MAX_POOL_SIZE:-4}"
      TEST_EXECUTION_QUEUE_CAPACITY: "${TEST_EXECUTION_QUEUE_CAPACITY:-100}"
      TEST_SUITE_MAX_CASES: "${TEST_SUITE_MAX_CASES:-50}"
      SILICONFLOW_API_KEY: "${SILICONFLOW_API_KEY:-}"
      SILICONFLOW_BASE_URL: "${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}"
      SILICONFLOW_MODEL: "${SILICONFLOW_MODEL:-}"
      SILICONFLOW_MAX_TOKENS: "${SILICONFLOW_MAX_TOKENS:-4096}"
      SILICONFLOW_TIMEOUT: "${SILICONFLOW_TIMEOUT:-PT90S}"
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}"
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      demo-api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: autotest-ai-frontend:local
    container_name: autotest-ai-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
